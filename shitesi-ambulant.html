<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shitësi Ambulant</title>

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #16a34a; --green-light: #dcfce7; --green-dark: #15803d;
    --red: #dc2626; --red-light: #fee2e2;
    --amber: #d97706; --amber-light: #fef3c7;
    --blue: #2563eb; --blue-light: #dbeafe;
    --bg: #f0fdf4; --surface: #ffffff; --surface2: #f7fef9;
    --border: #bbf7d0; --text: #14532d; --text2: #166534;
    --shadow: 0 2px 12px rgba(22,163,74,0.10);
    --radius: 14px; --radius-sm: 8px;
  }
  body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
